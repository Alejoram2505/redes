[tool.ruff]
target-version = "py311"
line-length = 120
cache-dir = ".runtime/ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
files = ["plant_energy_mcp", "mcp_host", "demos", "project_gui"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
